name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release version consistency
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-version-consistency.ps1

      - name: Prepare release configuration
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/prepare-release-config.mjs --tag "$env:RELEASE_TAG" --output src-tauri/tauri.release.conf.json

      - name: Load release notes
        id: release-notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $notesPath = Join-Path $env:RUNNER_TEMP 'branch-schematic-release-notes.md'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/extract-release-notes.ps1 `
            -Tag $env:RELEASE_TAG `
            -OutputPath $notesPath

          "body<<RELEASE_NOTES" >> $env:GITHUB_OUTPUT
          Get-Content $notesPath -Raw >> $env:GITHUB_OUTPUT
          "RELEASE_NOTES" >> $env:GITHUB_OUTPUT

      - name: Build and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Branch Schematic ${{ github.ref_name }}
          releaseBody: ${{ steps.release-notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: "--config src-tauri/tauri.release.conf.json --bundles nsis"
